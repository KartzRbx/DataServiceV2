[package]
name = "kartzrbx/dataservicev2"
description = """
KeepData — typed player stores for Roblox (formerly DataServiceV2).

Features:
- CreateStore / Server Init with ProfileStore persistence and QuickNet replication
- Typed path tokens (Store.Paths.Currencies.Coins) — PathOf, Patch, Watch on handles
- Multi-store client replication (Client:Init StoreNames, GetStore)
- OrderedDataStore leaderboards with delta/full sync and client rank signals
- Migrations (TemplateVersion), Policy (rate limit, ACL, audit), session-only data
- Transient overlay API for admin/QA (not saved to ProfileStore)
- GetOrderedList / GetOrderedListWithPriority for sorted table queries
- Bundled signal, quicknet, janitor — no extra Wally deps in consuming games
"""
version = "3.2.0"
license = "MIT"
authors = ["KartzRBX"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.lock", "wally.toml"]


[dependencies]
