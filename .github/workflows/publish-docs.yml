name: publish-docs

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

# GitHub Pages: branch gh-pages, folder /. Starlight base must match repo name (/DataServiceV2/).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build Starlight
        run: |
          npm install
          npm run docs:build
      - name: Postprocess static output
        run: node scripts/postprocess-pages.mjs
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/dist
